<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Tic Tac Toe vs AI</title>

<style>
    body {
        font-family: Arial, sans-serif;
        text-align: center;
        background-color: #f0f8ff;
    }

    h1 {
        margin-top: 20px;
    }

    .scoreboard {
        font-size: 20px;
        margin: 20px;
    }

    .board {
        display: grid;
        grid-template-columns: repeat(3, 100px);
        grid-gap: 5px;
        justify-content: center;
        margin: 20px auto;
    }

    .cell {
        width: 100px;
        height: 100px;
        font-size: 40px;
        background: white;
        border: 2px solid #333;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
    }

    .cell:hover {
        background: #e0e0e0;
    }

    button {
        padding: 10px 20px;
        font-size: 16px;
        margin-top: 10px;
    }
</style>
</head>

<body>

<h1>Tic Tac Toe vs AI</h1>

<div class="scoreboard">
    You: <span id="playerScore">0</span> |
    AI: <span id="aiScore">0</span>
</div>

<div class="board" id="board"></div>

<h2 id="status">Your turn</h2>

<button onclick="resetGame()">Reset Game</button>

<script>
    const board = document.getElementById("board");
    const statusText = document.getElementById("status");

    let cells = ["", "", "", "", "", "", "", "", ""];
    let playerScore = 0;
    let aiScore = 0;
    let gameActive = true;

    // Create board
    function createBoard() {
        board.innerHTML = "";
        cells.forEach((cell, index) => {
            const div = document.createElement("div");
            div.classList.add("cell");
            div.addEventListener("click", () => playerMove(index));
            div.textContent = cell;
            board.appendChild(div);
        });
    }

    function playerMove(index) {
        if (cells[index] !== "" || !gameActive) return;

        cells[index] = "X";
        updateBoard();

        if (checkWinner("X")) {
            playerScore++;
            endRound("You win!");
            return;
        }

        if (!cells.includes("")) {
            endRound("Draw!");
            return;
        }

        aiMove();
    }

    function aiMove() {
        let emptyIndices = cells
            .map((val, idx) => val === "" ? idx : null)
            .filter(v => v !== null);

        let move = emptyIndices[Math.floor(Math.random() * emptyIndices.length)];
        cells[move] = "O";
        updateBoard();

        if (checkWinner("O")) {
            aiScore++;
            endRound("AI wins!");
            return;
        }

        if (!cells.includes("")) {
            endRound("Draw!");
        }
    }

    function updateBoard() {
        document.querySelectorAll(".cell").forEach((cell, i) => {
            cell.textContent = cells[i];
        });
    }

    function checkWinner(player) {
        const wins = [
            [0,1,2],[3,4,5],[6,7,8],
            [0,3,6],[1,4,7],[2,5,8],
            [0,4,8],[2,4,6]
        ];
        return wins.some(comb => comb.every(i => cells[i] === player));
    }

    function endRound(message) {
        gameActive = false;
        document.getElementById("playerScore").textContent = playerScore;
        document.getElementById("aiScore").textContent = aiScore;

        if (playerScore === 5) {
            statusText.textContent = "🎉 You reached 5! You win the match!";
            return;
        }

        if (aiScore === 5) {
            statusText.textContent = "🤖 AI reached 5! AI wins the match!";
            return;
        }

        statusText.textContent = message + " Next round starting...";

        setTimeout(resetBoard, 1500);
    }

    function resetBoard() {
        cells = ["", "", "", "", "", "", "", "", ""];
        gameActive = true;
        statusText.textContent = "Your turn";
        createBoard();
    }

    function resetGame() {
        playerScore = 0;
        aiScore = 0;
        resetBoard();
        document.getElementById("playerScore").textContent = 0;
        document.getElementById("aiScore").textContent = 0;
    }

    createBoard();
</script>

</body>
</html>
